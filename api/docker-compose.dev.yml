# Postgres para DESARROLLO LOCAL. No es el despliegue.
#
# El de produccion es `docker-compose.yml` en la raiz, con los tres servicios de la
# aplicacion y sin base de datos. Este solo levanta un Postgres para trabajar en local:
#
#   docker compose -f api/docker-compose.dev.yml up -d
#
# Se llamaba `docker-compose.yml` y se presto a confusion: al configurar el despliegue
# se eligio este por su nombre y fallo con "service web does not exist in the compose",
# porque aqui solo hay una base de datos.

services:
  db:
    image: postgres:17-alpine
    container_name: jc2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jc2
      POSTGRES_PASSWORD: jc2
      POSTGRES_DB: jc2
    ports:
      - '5432:5432'
    volumes:
      # Volumen con nombre: los datos sobreviven al redespliegue (deployment.md:63-66).
      - jc2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jc2 -d jc2']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jc2-postgres-data:
