# Cabeceras de seguridad del documento. Las de la API las pone la API.
#
# Van en un fichero aparte y se incluyen en CADA bloque `location` que defina su propio
# `add_header`, porque nginx **no acumula**: en cuanto un `location` declara uno, deja
# de heredar todos los del nivel de arriba. Con las cabeceras solo en `server`, `/` se
# servia sin ninguna —cae en `location = /index.html`, que fija `Cache-Control`— y los
# assets tampoco las llevaban.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Politica de contenidos (ERS §38).
#
# Lo que de verdad protege es `script-src 'self'`: el HTML que el titular escribe en
# Markdown se sanea en el servidor, y aunque algo se colase, un script en linea no se
# ejecutaria. El bundle compilado no lleva ninguno; se comprobo.
#
# `style-src` si admite lineas sueltas: hay atributos `style` legitimos —el color de
# boton que se elige por evento, la opacidad de un fondo— y bloquearlos romperia la
# pagina sin ganar nada, porque un atributo de estilo no ejecuta codigo.
#
# Google Fonts necesita dos permisos distintos: la hoja viene de fonts.googleapis.com
# y los archivos de fuente de fonts.gstatic.com.
#
# `img-src` no necesita dominios externos: las imagenes salen de /api/public/media,
# que con el proxy es este mismo origen.
#
# `frame-src` lista los reproductores de video, y es la segunda mitad de la decision:
# la primera es la lista blanca de `shared/markdown/render.ts`, que decide que iframes
# sobreviven al saneado. Sin esta linea el iframe llegaria al navegador y el navegador
# lo bloquearia, porque a falta de `frame-src` manda `default-src 'self'`. Las dos
# listas dicen lo mismo a proposito: la del servidor evita que se guarde, y esta evita
# que se pinte si alguna vez se guardo.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; upgrade-insecure-requests" always;
