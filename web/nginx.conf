upstream jc2_api {
  # Nombre del servicio de la API en la red de contenedores. Cambialo si el tuyo se
  # llama de otra forma.
  server api:4000;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Y aqui para todo lo que no entre en ningun `location` con `add_header` propio.
  include /etc/nginx/security-headers.conf;

  # Un solo origen para el sitio y la API. No es comodidad: la API responde
  # `Cross-Origin-Resource-Policy` y la cookie de sesion es HttpOnly, y las dos cosas
  # se comportan mejor cuando no hay salto de origen. Ademas asi CORS deja de ser
  # imprescindible para que el sitio funcione.
  #
  # Se pasa SOLO `/api`. `/docs` y `/openapi.json` se quedan fuera a proposito: la
  # documentacion de la API no tiene por que ser alcanzable desde la web publica.
  location /api/ {
    proxy_pass http://jc2_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # La API confia en un unico salto de proxy para contar el limite de peticiones por
    # IP real. Si delante hay otro proxy mas, hay que subir ese salto tambien.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MAX_UPLOAD_BYTES son 100 MB. El limite por defecto de nginx es 1 MB, asi que sin
    # esto toda subida grande moriria aqui con un 413 antes de llegar a la API.
    client_max_body_size 105m;

    # Las descargas van por streaming: sin esto nginx acumula el archivo entero en
    # disco antes de empezar a enviarlo.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Los rastreadores buscan estos dos en la raiz. Los genera la API a partir de lo
  # que hay publicado, asi que publicar un trabajo lo mete en el sitemap sin tocar
  # nada aqui (ERS §39).
  location = /robots.txt {
    proxy_pass http://jc2_api/api/public/robots.txt;
    proxy_set_header Host $host;
  }

  location = /sitemap.xml {
    proxy_pass http://jc2_api/api/public/sitemap.xml;
    proxy_set_header Host $host;
  }

  # Los assets llevan hash en el nombre, asi que son inmutables y se pueden cachear
  # indefinidamente.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html NUNCA se cachea: es lo que apunta a la version actual de los assets.
  # Con cache, un despliegue nuevo seguiria sirviendo el bundle viejo.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Enrutado del lado del cliente: cualquier ruta desconocida devuelve index.html y
  # deja que TanStack Router resuelva. Sin esto, recargar en /research da un 404.
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
